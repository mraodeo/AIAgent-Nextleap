name: Weekly AI Review Pulse

on:
  schedule:
    # Runs at 08:00 UTC every Monday
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-pulse-agent:
    runs-on: ubuntu-latest
    
    # Required permissions to commit back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Pulse Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: |
          python src/main.py

      - name: Commit updated JSON data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update AI pulse report data [skip ci]"
          file_pattern: 'frontend/public/data.json'
          branch: main
